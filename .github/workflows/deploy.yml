name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/datnguyen305/mandarin-flow-api
  BACKEND_IMAGE: ghcr.io/datnguyen305/mandarin-flow-backend
  FRONTEND_IMAGE: ghcr.io/datnguyen305/mandarin-flow-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.mod

      - name: Test Go API
        working-directory: go-api
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test

      - name: Validate deployment configuration
        env:
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: validation-only
          FRONTEND_URL: https://mandarinflow.online
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://mandarinflow.online' }}
          DEV_ACCESS_TOKEN: validation-only
        run: |
          test "$NEXT_PUBLIC_API_BASE_URL" = "https://mandarinflow.online"
          bash -n scripts/deploy_production.sh scripts/rollback_production.sh scripts/restore_local_db.sh scripts/bootstrap_vps.sh
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Go API
        uses: docker/build-push-action@v7
        with:
          context: ./go-api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=go-api
          cache-to: type=gha,mode=max,scope=go-api

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://mandarinflow.online' }}
            NEXT_PUBLIC_FEEDBACK_EMAIL=${{ vars.NEXT_PUBLIC_FEEDBACK_EMAIL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare VPS runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'set -eu
             export DEBIAN_FRONTEND=noninteractive
             command -v git >/dev/null 2>&1 || { apt-get update && apt-get install -y ca-certificates curl git; }
             command -v docker >/dev/null 2>&1 || { curl -fsSL https://get.docker.com | sh; }
             systemctl enable --now docker
             if [ ! -d /root/mandarin_flow/.git ]; then
               [ ! -e /root/mandarin_flow ] || { echo "/root/mandarin_flow exists but is not a Git checkout" >&2; exit 1; }
               git clone --branch main --single-branch https://github.com/datnguyen305/mandarin_flow.git /root/mandarin_flow
             fi
             install -d -m 700 /root/mandarin_flow/cookies'

      - name: Update VPS checkout
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'cd /root/mandarin_flow && git switch main && git pull --ff-only origin main'

      - name: Authenticate VPS to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy immutable release
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/mandarin_flow && scripts/deploy_production.sh '$DEPLOY_SHA'"

      - name: Diagnose failed service startup
        if: failure()
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/mandarin_flow && \
             IMAGE_TAG='$DEPLOY_SHA' docker compose -f docker-compose.prod.yml ps && \
             echo '--- backend logs ---' && \
             IMAGE_TAG='$DEPLOY_SHA' docker compose -f docker-compose.prod.yml logs --no-color --tail=180 backend && \
             echo '--- go-api logs ---' && \
             IMAGE_TAG='$DEPLOY_SHA' docker compose -f docker-compose.prod.yml logs --no-color --tail=80 go-api"

      - name: Verify production health
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 https://mandarinflow.online/ready
