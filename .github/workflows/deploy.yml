name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/datnguyen305/mandarin-flow-api
  BACKEND_IMAGE: ghcr.io/datnguyen305/mandarin-flow-backend
  FRONTEND_IMAGE: ghcr.io/datnguyen305/mandarin-flow-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.mod

      - name: Test Go API
        working-directory: go-api
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Go API
        uses: docker/build-push-action@v7
        with:
          context: ./go-api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=go-api
          cache-to: type=gha,mode=max,scope=go-api

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://mandarinflow.online
            NEXT_PUBLIC_FEEDBACK_EMAIL=${{ vars.NEXT_PUBLIC_FEEDBACK_EMAIL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare VPS runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'set -eu
             export DEBIAN_FRONTEND=noninteractive
             command -v git >/dev/null 2>&1 || { apt-get update && apt-get install -y ca-certificates curl git; }
             command -v docker >/dev/null 2>&1 || { curl -fsSL https://get.docker.com | sh; }
             systemctl enable --now docker
             if [ ! -d /root/mandarin_flow/.git ]; then
               rm -rf /root/mandarin_flow
               git clone --branch main --single-branch https://github.com/datnguyen305/mandarin_flow.git /root/mandarin_flow
             fi
             install -d -m 700 /root/mandarin_flow/cookies'

      - name: Pull release images
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/mandarin_flow && \
             git switch main && \
             git pull --ff-only origin main && \
             docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             IMAGE_TAG='$DEPLOY_SHA' docker compose -f docker-compose.prod.yml pull go-api backend frontend"

      - name: Sync production environment
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$PRODUCTION_ENV_FILE" || { echo "Missing GitHub Secret: PRODUCTION_ENV_FILE" >&2; exit 1; }
          printf '%s' "$PRODUCTION_ENV_FILE" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'umask 077 && cd /root/mandarin_flow && cat > .env'

      - name: Recreate services with synced environment
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/mandarin_flow && \
             IMAGE_TAG='$DEPLOY_SHA' docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate --remove-orphans && \
             docker compose -f docker-compose.prod.yml ps"

      - name: Diagnose failed service startup
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/mandarin_flow && \
             docker compose -f docker-compose.prod.yml ps && \
             echo '--- backend logs ---' && \
             docker compose -f docker-compose.prod.yml logs --no-color --tail=180 backend && \
             echo '--- go-api logs ---' && \
             docker compose -f docker-compose.prod.yml logs --no-color --tail=80 go-api"

      - name: Verify production health
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 https://mandarinflow.online/ready
