services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-youtube_language_learning}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-youtube_language_learning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/datnguyen305/mandarin-flow-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}@postgres:5432/${POSTGRES_DB:-youtube_language_learning}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-local}
      DICTIONARY_PROVIDER: ${DICTIONARY_PROVIDER:-cvdict}
      CVDICT_PATH: ${CVDICT_PATH:-app/data/CVDICT.u8}
      ASR_PROVIDER: ${ASR_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSLATION_API_KEY: ${OPENAI_TRANSLATION_API_KEY:-}
      OPENAI_ASR_API_KEY: ${OPENAI_ASR_API_KEY:-}
      OPENAI_CHAT_API_KEY: ${OPENAI_CHAT_API_KEY:-}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4o-mini}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_ASR_MODEL: ${OPENAI_ASR_MODEL:-whisper-1}
      ASR_MAX_DURATION_SECONDS: ${ASR_MAX_DURATION_SECONDS:-1800}
      ASR_CHUNK_DURATION_SECONDS: ${ASR_CHUNK_DURATION_SECONDS:-300}
      ASR_CONNECT_TIMEOUT_SECONDS: ${ASR_CONNECT_TIMEOUT_SECONDS:-15}
      ASR_READ_TIMEOUT_SECONDS: ${ASR_READ_TIMEOUT_SECONDS:-180}
      ASR_WRITE_TIMEOUT_SECONDS: ${ASR_WRITE_TIMEOUT_SECONDS:-180}
      ASR_POOL_TIMEOUT_SECONDS: ${ASR_POOL_TIMEOUT_SECONDS:-15}
      ASR_MAX_ATTEMPTS_PER_CHUNK: ${ASR_MAX_ATTEMPTS_PER_CHUNK:-3}
      ASR_RETRY_BACKOFF_SECONDS: ${ASR_RETRY_BACKOFF_SECONDS:-2}
      DEV_ACCESS_TOKEN: ${DEV_ACCESS_TOKEN:?DEV_ACCESS_TOKEN is required}
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE:-/app/cookies/cookies.txt}
      YT_DLP_JS_RUNTIME_PATH: ${YT_DLP_JS_RUNTIME_PATH:-/root/.deno/bin/deno}
      YT_DLP_REMOTE_COMPONENTS: ${YT_DLP_REMOTE_COMPONENTS:-ejs:github}
      YT_DLP_PLAYER_CLIENT: ${YT_DLP_PLAYER_CLIENT:-}
      YT_DLP_MAX_ATTEMPTS: ${YT_DLP_MAX_ATTEMPTS:-2}
      YT_DLP_RETRY_BACKOFF_SECONDS: ${YT_DLP_RETRY_BACKOFF_SECONDS:-1.5}
      YT_DLP_SOCKET_TIMEOUT: ${YT_DLP_SOCKET_TIMEOUT:-30}
      PATH: /root/.deno/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SUBTITLE_BATCH_SECONDS: ${SUBTITLE_BATCH_SECONDS:-120}
      TRANSLATION_BATCH_SIZE: ${TRANSLATION_BATCH_SIZE:-30}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      GUEST_COOKIE_NAME: ${GUEST_COOKIE_NAME:-mandarinflow_guest}
      GUEST_SESSION_DAYS: ${GUEST_SESSION_DAYS:-365}
      SUBTITLE_NLP_PROVIDER: ${SUBTITLE_NLP_PROVIDER:-openai}
      OPENAI_NLP_MODEL: ${OPENAI_NLP_MODEL:-gpt-4o-mini}
      VIDEO_TOPIC_CLASSIFIER_PROVIDER: ${VIDEO_TOPIC_CLASSIFIER_PROVIDER:-openai}
      OPENAI_TOPIC_MODEL: ${OPENAI_TOPIC_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_CONNECT_TIMEOUT_SECONDS: ${TELEGRAM_CONNECT_TIMEOUT_SECONDS:-15}
      TELEGRAM_READ_TIMEOUT_SECONDS: ${TELEGRAM_READ_TIMEOUT_SECONDS:-30}
      TELEGRAM_WRITE_TIMEOUT_SECONDS: ${TELEGRAM_WRITE_TIMEOUT_SECONDS:-30}
      TELEGRAM_POOL_TIMEOUT_SECONDS: ${TELEGRAM_POOL_TIMEOUT_SECONDS:-15}
      TELEGRAM_MAX_ATTEMPTS: ${TELEGRAM_MAX_ATTEMPTS:-3}
      TELEGRAM_RETRY_BACKOFF_SECONDS: ${TELEGRAM_RETRY_BACKOFF_SECONDS:-0.5}
      AGENT_REQUEST_EXPIRY_HOURS: ${AGENT_REQUEST_EXPIRY_HOURS:-24}
    volumes:
      - ./cookies:/app/cookies
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  go-api:
    image: ghcr.io/datnguyen305/mandarin-flow-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      LISTEN_ADDRESS: :8080
      LEGACY_BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}@postgres:5432/${POSTGRES_DB:-youtube_language_learning}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      GUEST_COOKIE_NAME: ${GUEST_COOKIE_NAME:-mandarinflow_guest}
      GUEST_SESSION_DAYS: ${GUEST_SESSION_DAYS:-365}
      DEV_ACCESS_TOKEN: ${DEV_ACCESS_TOKEN:?DEV_ACCESS_TOKEN is required}
      YT_DLP_COOKIES_FILE: /app/cookies/cookies.txt
    volumes:
      - ./cookies:/app/cookies
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/datnguyen305/mandarin-flow-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_FEEDBACK_EMAIL: ${NEXT_PUBLIC_FEEDBACK_EMAIL:-}
    depends_on:
      - go-api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_SITE_ADDRESS: ${PUBLIC_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - go-api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
