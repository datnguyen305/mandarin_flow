services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: youtube_language_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youtube_language_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/youtube_language_learning
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-local}
      DICTIONARY_PROVIDER: ${DICTIONARY_PROVIDER:-cvdict}
      CVDICT_PATH: ${CVDICT_PATH:-app/data/CVDICT.u8}
      ASR_PROVIDER: ${ASR_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSLATION_API_KEY: ${OPENAI_TRANSLATION_API_KEY:-}
      OPENAI_ASR_API_KEY: ${OPENAI_ASR_API_KEY:-}
      OPENAI_CHAT_API_KEY: ${OPENAI_CHAT_API_KEY:-}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4o-mini}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_ASR_MODEL: ${OPENAI_ASR_MODEL:-whisper-1}
      ASR_MAX_DURATION_SECONDS: ${ASR_MAX_DURATION_SECONDS:-1800}
      DEV_ACCESS_TOKEN: ${DEV_ACCESS_TOKEN:-}
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE:-/app/cookies/cookies.txt}
      YT_DLP_JS_RUNTIME_PATH: ${YT_DLP_JS_RUNTIME_PATH:-/root/.deno/bin/deno}
      YT_DLP_REMOTE_COMPONENTS: ${YT_DLP_REMOTE_COMPONENTS:-ejs:github}
      YT_DLP_PLAYER_CLIENT: ${YT_DLP_PLAYER_CLIENT:-}
      YT_DLP_MAX_ATTEMPTS: ${YT_DLP_MAX_ATTEMPTS:-2}
      YT_DLP_RETRY_BACKOFF_SECONDS: ${YT_DLP_RETRY_BACKOFF_SECONDS:-1.5}
      YT_DLP_SOCKET_TIMEOUT: ${YT_DLP_SOCKET_TIMEOUT:-30}
      PATH: /root/.deno/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SUBTITLE_BATCH_SECONDS: ${SUBTITLE_BATCH_SECONDS:-120}
      TRANSLATION_BATCH_SIZE: ${TRANSLATION_BATCH_SIZE:-30}
      SUBTITLE_NLP_PROVIDER: ${SUBTITLE_NLP_PROVIDER:-openai}
      OPENAI_NLP_MODEL: ${OPENAI_NLP_MODEL:-gpt-4o-mini}
      VIDEO_TOPIC_CLASSIFIER_PROVIDER: ${VIDEO_TOPIC_CLASSIFIER_PROVIDER:-openai}
      OPENAI_TOPIC_MODEL: ${OPENAI_TOPIC_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AGENT_REQUEST_EXPIRY_HOURS: ${AGENT_REQUEST_EXPIRY_HOURS:-24}
    volumes:
      - ./cookies:/app/cookies
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  go-api:
    build:
      context: ./go-api
    environment:
      LISTEN_ADDRESS: :8080
      LEGACY_BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/youtube_language_learning
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      GUEST_COOKIE_NAME: ${GUEST_COOKIE_NAME:-mandarinflow_guest}
      GUEST_SESSION_DAYS: ${GUEST_SESSION_DAYS:-365}
      DEV_ACCESS_TOKEN: ${DEV_ACCESS_TOKEN:-}
      YT_DLP_COOKIES_FILE: /app/cookies/cookies.txt
    volumes:
      - ./cookies:/app/cookies
    ports:
      - "8000:8080"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-http://localhost:8000}
        NEXT_PUBLIC_FEEDBACK_EMAIL: ${NEXT_PUBLIC_FEEDBACK_EMAIL:-}
        API_PROXY_TARGET: http://go-api:8080
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-http://localhost:8000}
      NEXT_PUBLIC_FEEDBACK_EMAIL: ${NEXT_PUBLIC_FEEDBACK_EMAIL:-}
    ports:
      - "3000:3000"
    depends_on:
      - go-api

volumes:
  postgres_data:
